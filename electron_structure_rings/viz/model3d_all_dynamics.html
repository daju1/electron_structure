<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<title>Все динамики колец: glide и мёбиус</title>
<style>
body{margin:0;font-family:-apple-system,Segoe UI,Arial,sans-serif;background:#fafafa;color:#222}
#bar{padding:8px 12px;background:#fff;border-bottom:1px solid #ddd;display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:13px}
#bar button{padding:4px 10px;border:1px solid #bbb;background:#f4f4f4;border-radius:4px;cursor:pointer}
#bar button.on{background:#2b6cb0;color:#fff;border-color:#2b6cb0}
#wrap{position:relative}canvas{display:block;cursor:grab}
#info{position:absolute;right:10px;top:10px;width:330px;background:#fffffff0;border:1px solid #ddd;border-radius:6px;padding:10px;font-size:12px;line-height:1.4}
#info table{border-collapse:collapse;width:100%}#info td{border-top:1px solid #eee;padding:3px 2px;vertical-align:top}
.lg span{display:inline-block;margin-right:10px}
</style></head><body>
<div id="bar">
 <b>Плоскость поворота b (мёбиус):</b>
 <span id="planes"></span>
 <button id="play">❚❚ Пауза</button>
 <label>φ <input id="phi" type="range" min="0" max="720" value="0" step="1" style="width:220px"> <span id="phiv">0°</span></label>
 <label>скорость <input id="spd" type="range" min="5" max="120" value="40"></label>
 <span class="lg"><span style="color:#2a5bd7">● N</span><span style="color:#d22">● S</span>
 <span style="color:#1a7f37">— b</span><span>■ винт</span><span>◇ glide-край</span><span style="color:#e08a00">▲ призм. край</span><span>✕ разрез</span><span>⚡ шов Δb</span></span>
</div>
<div id="wrap"><canvas id="cv"></canvas>
<div id="info"><b>Все теоретически возможные динамики</b> (сверка: deWit 1973 II; Kleman–Friedel 2008 — см. ref/README)
<table id="tab"></table>
<p style="margin:6px 0 0">Мышь: вращать · колесо: масштаб · двойной клик: сброс вида.</p></div></div>
<script>
// rings_core.js — математика всех динамик (общая для веб-модели и тестов)
// Кольцо радиуса R в плоскости z = s·H; s=+1 — N, s=−1 — S. Базис кольца e_r, e_t (линия), e_z.
// φ = ω t — фаза прецессии; особые точки N/S в противофазе.
var R = 4.0, H = 3.0, B0 = 1.3, TWO_PI = 2 * Math.PI;
var PLANES = { rz: ['r', 'z'], rt: ['r', 't'], tz: ['t', 'z'] };
var PLANE_NAME = { rz: '(e_r,e_z): вокруг линии', rt: '(e_r,e_t): в плоскости кольца', tz: '(e_t,e_z): винт↔призм.' };

function mod2pi(x) { return ((x % TWO_PI) + TWO_PI) % TWO_PI; }
function frame(th) {
  return { r: [Math.cos(th), Math.sin(th), 0], t: [-Math.sin(th), Math.cos(th), 0], z: [0, 0, 1] };
}
function lin(a, ka, b, kb) { return [a[0] * ka + b[0] * kb, a[1] * ka + b[1] * kb, a[2] * ka + b[2] * kb]; }
function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
function poleAngle(s, phi) { return s > 0 ? phi : phi + Math.PI; }
function cutAngle(s) { return s > 0 ? 0 : Math.PI; }

// Описание вариантов
var KINDS = {
  gT3: { mobius: false, title: 'glide, строгая T(3)', sub: 'b постоянен и неподвижен', period: '—', stat: 'нет прецессии' },
  gCos: { mobius: false, title: 'glide, среда Коссера', sub: 'b переносится репером, ω', period: '2π', stat: 'бозон' },
  mA: { mobius: true, title: 'мёбиус A', sub: 'b стоит, бежит шов Δb; перемычка N–S', period: '4π', stat: 'фермион' },
  mB: { mobius: true, title: 'мёбиус B', sub: 'b вращается с ω/2, разрез неподвижен (±b)', period: '4π', stat: 'фермион' },
  mC: { mobius: true, title: 'мёбиус C', sub: 'b с ω/2 + бегущий шов', period: '2π', stat: 'бозон (контрпример)' }
};

// Вектор Бюргерса в точке кольца с азимутом th
function burgers(kind, s, th, phi, plane) {
  if (kind === 'gT3') return [s * B0, 0, 0];
  if (kind === 'gCos') return [s * B0 * Math.cos(phi), s * B0 * Math.sin(phi), 0];
  var f = frame(th), u = f[PLANES[plane][0]], v = f[PLANES[plane][1]], psi;
  if (kind === 'mA') psi = mod2pi(th - poleAngle(s, phi)) / 2 + phi / 2;        // χ от бегущего шва
  else if (kind === 'mB') psi = -mod2pi(th - cutAngle(s)) / 2 + phi / 2;        // χ от неподвижного разреза
  else psi = mod2pi(th - poleAngle(s, phi)) / 2 + phi;                           // mC
  return lin(u, s * B0 * Math.cos(psi), v, s * B0 * Math.sin(psi));
}

// Положение особой точки (то, что «бежит» по кольцу)
function specialPoint(kind, s, phi) {
  if (kind === 'mB') return cutAngle(s) + mod2pi(phi);   // там, где b ∥ ±u
  return poleAngle(s, phi);
}
// Скачок b на шве/разрезе (для A и C — на бегущем шве, для B — на разрезе)
function seamAngle(kind, s, phi) { return kind === 'mB' ? cutAngle(s) : poleAngle(s, phi); }
function seamJump(kind, s, phi, plane) {
  var a = seamAngle(kind, s, phi), e = 1e-7;
  return lin(burgers(kind, s, a - e, phi, plane), 1, burgers(kind, s, a + e, phi, plane), -1);
}

// Характерные точки: где b ∥ e_t (винт), e_r (glide-край), e_z (призм. край)
function charPoints(kind, s, phi, plane) {
  var n = 720, out = { t: [], r: [], z: [] }, seam = KINDS[kind].mobius ? seamAngle(kind, s, phi) : null;
  ['t', 'r', 'z'].forEach(function (key) {
    var c = [];
    for (var i = 0; i < n; i++) {
      var th = TWO_PI * i / n, b = burgers(kind, s, th, phi, plane);
      c.push(Math.abs(dot(b, frame(th)[key])) / B0);
    }
    for (var i = 0; i < n; i++) {
      var p = c[(i - 1 + n) % n], q = c[(i + 1) % n];
      if (c[i] > 0.985 && c[i] >= p && c[i] > q) {
        var th = TWO_PI * i / n;
        if (seam !== null && Math.abs(mod2pi(th - seam + Math.PI) - Math.PI) < 0.03) continue;
        out[key].push(th);
      }
    }
  });
  return out;
}

if (typeof module !== 'undefined') module.exports = {
  burgers: burgers, specialPoint: specialPoint, seamJump: seamJump, charPoints: charPoints,
  KINDS: KINDS, PLANES: PLANES, B0: B0, frame: frame, dot: dot, lin: lin, poleAngle: poleAngle, cutAngle: cutAngle
};

var ORDER=['gT3','gCos','mA','mB','mC'];
var NOTE={gT3:'deWit (3.6): b постоянен; особой точки со скачком нет.',
 gCos:'Внутр. b^a постоянен, поворачивается репер; b_N+b_S=0.',
 mA:'Шов = член Ω×(x−x⁰), deWit (5.5); по (4.3) нужна перемычка N–S. Проверка: ΔbN+ΔbS≠0 в общем случае — одна перемычка не замыкает.',
 mB:'b — директор (±b), разрез ненаблюдаем, как k=½ у Kleman–Friedel. Δb на бегущей точке нет → q_m не здесь.',
 mC:'Вращение ω/2 + бегущий шов: за 2π b→b. Показан как контрпример.'};
var POS={gT3:[-12,9],gCos:[0,9],mA:[-12,-9],mB:[0,-9],mC:[12,-9]};
var plane='rz', playing=true, phi=0, last=null;
var cv=document.getElementById('cv'), cx=cv.getContext('2d');
var yaw=-0.55, pitch=0.62, zoom=1, drag=null;
function resize(){cv.width=innerWidth;cv.height=innerHeight-document.getElementById('bar').offsetHeight;}
addEventListener('resize',resize);resize();
cv.onmousedown=function(e){drag=[e.clientX,e.clientY,yaw,pitch];cv.style.cursor='grabbing'};
addEventListener('mouseup',function(){drag=null;cv.style.cursor='grab'});
addEventListener('mousemove',function(e){if(!drag)return;yaw=drag[2]+(e.clientX-drag[0])*0.008;pitch=Math.max(-1.5,Math.min(1.5,drag[3]+(e.clientY-drag[1])*0.008));});
cv.onwheel=function(e){e.preventDefault();zoom*=Math.exp(-e.deltaY*0.001)};
cv.ondblclick=function(){yaw=-0.55;pitch=0.62;zoom=1};
function P(p){ // 3D→экран
  var x=p[0],y=p[1],z=p[2],cy=Math.cos(yaw),sy=Math.sin(yaw);
  var x1=x*cy-y*sy, y1=x*sy+y*cy; var cp=Math.cos(pitch),sp=Math.sin(pitch);
  var y2=y1*cp-z*sp, z2=y1*sp+z*cp; var f=480/(60+y2), sc=Math.min(cv.width,cv.height)/700*zoom;
  return [cv.width*0.42+x1*f*sc*1.6, cv.height/2-z2*f*sc*1.6, y2];}
function ringPt(th,z,o){return [o[0]+R*Math.cos(th),o[1]+R*Math.sin(th),z];}
var items;
function seg(a,b,col,w,dash){items.push({d:(P(a)[2]+P(b)[2])/2,f:function(){var A=P(a),B=P(b);cx.strokeStyle=col;cx.lineWidth=w;cx.setLineDash(dash||[]);cx.beginPath();cx.moveTo(A[0],A[1]);cx.lineTo(B[0],B[1]);cx.stroke();cx.setLineDash([]);}});}
function arrow(a,v,col){var b=[a[0]+v[0],a[1]+v[1],a[2]+v[2]];items.push({d:P(b)[2],f:function(){var A=P(a),B=P(b);cx.strokeStyle=col;cx.fillStyle=col;cx.lineWidth=2;cx.beginPath();cx.moveTo(A[0],A[1]);cx.lineTo(B[0],B[1]);cx.stroke();var an=Math.atan2(B[1]-A[1],B[0]-A[0]);cx.beginPath();cx.moveTo(B[0],B[1]);cx.lineTo(B[0]-8*Math.cos(an-0.4),B[1]-8*Math.sin(an-0.4));cx.lineTo(B[0]-8*Math.cos(an+0.4),B[1]-8*Math.sin(an+0.4));cx.fill();}});}
function mark(p,kind,col,size){items.push({d:P(p)[2]-0.01,f:function(){var A=P(p),s=size||6;cx.lineWidth=1.5;cx.strokeStyle='#000';cx.fillStyle=col;cx.beginPath();
 if(kind==='o')cx.arc(A[0],A[1],s,0,7);else if(kind==='s')cx.rect(A[0]-s,A[1]-s,2*s,2*s);else if(kind==='d'){cx.moveTo(A[0],A[1]-s);cx.lineTo(A[0]+s,A[1]);cx.lineTo(A[0],A[1]+s);cx.lineTo(A[0]-s,A[1]);cx.closePath();}
 else if(kind==='t'){cx.moveTo(A[0],A[1]-s);cx.lineTo(A[0]+s,A[1]+s);cx.lineTo(A[0]-s,A[1]+s);cx.closePath();}
 else if(kind==='x'){cx.moveTo(A[0]-s,A[1]-s);cx.lineTo(A[0]+s,A[1]+s);cx.moveTo(A[0]+s,A[1]-s);cx.lineTo(A[0]-s,A[1]+s);cx.lineWidth=3;cx.stroke();return;}
 cx.fill();cx.stroke();}});}
function text(p,s,col,font){items.push({d:-1e9,f:function(){var A=P(p);cx.font=font||'bold 13px Arial';cx.fillStyle=col||'#000';cx.textAlign='center';s.split('\n').forEach(function(l,i){cx.fillText(l,A[0],A[1]+i*15);});}});}
function drawParticle(k){
  var o=POS[k],K=KINDS[k];
  [[1,H,'#2a5bd7'],[-1,-H,'#d22']].forEach(function(q){
    var s=q[0],z=q[1],col=q[2],n=72;
    for(var i=0;i<n;i++)seg(ringPt(2*Math.PI*i/n,z,o),ringPt(2*Math.PI*(i+1)/n,z,o),col,3);
    for(var i=0;i<16;i++){var th=0.02+2*Math.PI*i/16;arrow(ringPt(th,z,o),burgers(k,s,th,phi,plane),'#1a7f37');}
    var cp=charPoints(k,s,phi,plane);
    cp.t.forEach(function(th){mark(ringPt(th,z,o),'s','#f2c500')});cp.r.forEach(function(th){mark(ringPt(th,z,o),'d','#fff')});cp.z.forEach(function(th){mark(ringPt(th,z,o),'t','#e08a00')});
    var sp=specialPoint(k,s,phi); mark(ringPt(sp,z,o),'o',col,8);
    if(K.mobius){var sa=k==='mB'?cutAngle(s):sp, J=seamJump(k,s,phi,plane), b=ringPt(sa,z,o);
      if(k==='mB')mark(b,'x','#000',6); arrow(b,[J[0]*0.5,J[1]*0.5,J[2]*0.5],'#000');}
    else if(k==='gT3') text(ringPt(sp,z+0.9,o),'?','#555');
    text([o[0]+R+1,o[1],z],s>0?'N':'S',col);
  });
  var pn=ringPt(specialPoint(k,1,phi),H,o), ps=ringPt(specialPoint(k,-1,phi),-H,o);
  seg(pn,ps,k==='mA'?'#8a2be2':'#999',k==='mA'?3:1.5,k==='mA'?[]:[4,4]);
  if(k==='mA')text([(pn[0]+ps[0])/2,(pn[1]+ps[1])/2,0.4],'перемычка Δb','#8a2be2','11px Arial');
  seg([o[0],o[1],-H-1.8],[o[0],o[1],H+1.8],'#7b2cbf',4);
  text([o[0],o[1],H+4.2],K.title+'\n'+K.sub+'\nпериод '+K.period+' · '+K.stat,'#111','bold 12px Arial');
}
function frame_(t){
  if(last===null)last=t; var dt=(t-last)/1000; last=t;
  if(playing){phi=(phi+dt*(+document.getElementById('spd').value)*Math.PI/180)%(4*Math.PI);document.getElementById('phi').value=Math.round(phi*180/Math.PI);}
  document.getElementById('phiv').textContent=Math.round(phi*180/Math.PI)+'° (оборот '+(phi<2*Math.PI?1:2)+' из 2)';
  cx.clearRect(0,0,cv.width,cv.height); items=[];
  ORDER.forEach(drawParticle);
  items.sort(function(a,b){return b.d-a.d}).forEach(function(i){i.f()});
  requestAnimationFrame(frame_);
}
var pl=document.getElementById('planes');
Object.keys(PLANES).forEach(function(k){var b=document.createElement('button');b.textContent=PLANE_NAME[k];b.onclick=function(){plane=k;[].forEach.call(pl.children,function(c){c.className=''});b.className='on'};if(k===plane)b.className='on';pl.appendChild(b);});
document.getElementById('play').onclick=function(){playing=!playing;this.textContent=playing?'❚❚ Пауза':'▶ Play'};
document.getElementById('phi').oninput=function(){phi=this.value*Math.PI/180;playing=false;document.getElementById('play').textContent='▶ Play'};
var tab=document.getElementById('tab');ORDER.forEach(function(k){var r=tab.insertRow();r.insertCell().innerHTML='<b>'+KINDS[k].title+'</b><br>'+KINDS[k].period+', '+KINDS[k].stat;r.insertCell().textContent=NOTE[k];});
requestAnimationFrame(frame_);
</script></body></html>
